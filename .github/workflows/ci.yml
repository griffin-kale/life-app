# Prüft jede Änderung, bevor sie nach main darf: Typen, Einheitstests, Sicherheits-Audit, Build, Ende-zu-Ende-Tests.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: life
          POSTGRES_PASSWORD: life-ci-only
          POSTGRES_DB: life
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U life"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://life:life-ci-only@localhost:5432/life
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Abhängigkeiten (ohne Installationsskripte)
        run: npm ci --ignore-scripts
      - name: Typen
        run: npm run typecheck
      - name: Einheitstests
        run: npm run test:unit
      - name: Sicherheits-Audit
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
      - name: Browser für Tests
        run: npx playwright install --with-deps chromium
      - name: Ende-zu-Ende-Tests
        run: npm run test:e2e
      - name: Testbericht bei Fehlern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
