# Prüft jede Änderung, bevor sie nach main darf: Typen, Einheitstests, Sicherheits-Audit, Build, Ende-zu-Ende-Tests.
name: CI

# Läuft für jeden Pull Request, auf main und als Vorstufe des Release (workflow_call).
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: life
          POSTGRES_PASSWORD: life-ci-only
          POSTGRES_DB: life
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U life"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://life:life-ci-only@localhost:5432/life
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Abhängigkeiten (ohne Installationsskripte)
        run: npm ci --ignore-scripts
      - name: Typen
        run: npm run typecheck
      - name: Einheitstests
        run: npm run test:unit
      - name: Sicherheits-Audit
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
      - name: Browser für Tests
        run: npx playwright install --with-deps chromium
      - name: Ende-zu-Ende-Tests
        run: npm run test:e2e
      - name: Testbericht bei Fehlern
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
