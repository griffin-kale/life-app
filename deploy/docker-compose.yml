# Läuft auf dem Hetzner-Server. Nur Caddy ist von außen erreichbar (Port 80/443).
# Logs aller Dienste: höchstens 3 × 10 MB, damit die Platte nicht vollläuft.
x-logs: &logs
  driver: json-file
  options: { max-size: 10m, max-file: "3" }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logs
    environment:
      POSTGRES_USER: life
      POSTGRES_DB: life
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U life"], interval: 10s, retries: 5 }

  app:
    # Fertiges Paket von GitHub (Version aus .env), Notweg: deploy.sh --build baut lokal
    image: ${GHCR_IMAGE:-life-app}:${LIFE_VERSION:-local}
    build: ..
    restart: unless-stopped
    logging: *logs
    env_file: .env
    environment:
      DATABASE_URL: postgres://life:${POSTGRES_PASSWORD}@db:5432/life
      BACKUP_STATUS_DIR: /backups
    # Nur lesend, damit /api/health den Stand der Sicherung kennt. Die Dumps selbst kann die App nicht lesen (600, root).
    volumes: [./backups:/backups:ro]
    depends_on: { db: { condition: service_healthy } }
    # Ungesund, wenn die Datenbank fehlt oder der Zeitplan mehr als fünf Minuten hängt (siehe /api/health)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logs
    ports: ["80:80", "443:443", "443:443/udp"]
    environment: { DOMAIN: "${DOMAIN}" }
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    depends_on: [app]
    # Caddys eigene Verwaltung antwortet nur innen auf Port 2019
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes: { pgdata: {}, caddy_data: {}, caddy_config: {} }
